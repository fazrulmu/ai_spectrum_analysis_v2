# ==========================
# Konfigurasi Utama Spektrum
# ==========================

# --- 1. Manajemen Path ---
paths:
  raw_data_dir: "data/raw/nist_jdx"
  processed_data_path: "data/processed/spectra_processed_data.pkl" # Data setelah preprocessing
  labels_path: "data/labels/auto_labels.csv"
  cas_list_json: "data/external/cas_list.json"
  manifest_path: "data/processed/data_manifest.csv" # <-- PATH BARU UNTUK MANIFES
  saved_models_dir: "saved_models/"
  reports_dir: "reports/"
  figures_dir: "reports/figures/"
  statistics_dir: "reports/statistics/"
  labels_audit_dir: "reports/data_audit"

# --- 2. Parameter Pra-pemrosesan ---
preprocessing:
  ir_grid:
    start: 4000
    stop: 90
    num_points: 3911 # 1 cm-1 interval (4000-90 = 3910 steps + 1)
  uv_grid:
    start: 90
    stop: 1000
    num_points: 911 # 1 nm interval (1000-90 = 910 steps + 1)

# --- 3. Parameter Model & Pelatihan CNN ---
modeling:
  test_set_size: 0.2
  random_state: 42
  cv_splits: 5 # set >1 untuk k-fold cross-validation (misal 5 untuk dataset kecil/UV)

  # Arsitektur CNN
  cnn_params:
    conv1_filters: 32
    conv1_kernel: 7
    pool1_size: 2
    conv2_filters: 64
    conv2_kernel: 5
    pool2_size: 2
    dense_metadata_units: 16
    dense_combined_units: 128
    dropout_rate: 0.5

  # Pelatihan
  training_params:
    learning_rate: 0.001
    epochs: 50
    batch_size: 32
    early_stopping_patience: 5

  # Augmentasi Data (INI BAGIAN YANG PENTING)
  augmentation:
    enabled: true
    factor: 5

# --- 4. Parameter Prediksi ---
prediction:
  probability_threshold: 0.3

loss_function: "hybrid"
