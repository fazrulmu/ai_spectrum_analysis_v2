# ==========================
# Konfigurasi Utama Spektrum
# ==========================

# --- 1. Manajemen Path ---
paths:
  raw_data_dir: "data/raw/nist_database"
  processed_data_path: "data/processed/spectra_processed_data.pkl" # Data setelah preprocessing
  labels_path: "data/labels/auto_labels.csv"
  saved_models_dir: "saved_models/"
  reports_dir: "reports/"
  figures_dir: "reports/figures/"

# --- 2. Parameter Pra-pemrosesan ---
preprocessing:
  ir_grid:
    start: 300
    stop: 4000
    num_points: 500
  uv_grid:
    start: 200
    stop: 800
    num_points: 300

# --- 3. Parameter Model & Pelatihan CNN ---
modeling:
  test_set_size: 0.2
  random_state: 42
  cv_splits: 5        # set >1 untuk k-fold cross-validation (misal 5 untuk dataset kecil/UV)

  # Arsitektur CNN
  cnn_params:
    conv1_filters: 32
    conv1_kernel: 7
    pool1_size: 2
    conv2_filters: 64
    conv2_kernel: 5
    pool2_size: 2
    dense_metadata_units: 16
    dense_combined_units: 128
    dropout_rate: 0.5

  # Pelatihan
  training_params:
    learning_rate: 0.001
    epochs: 50
    batch_size: 32
    early_stopping_patience: 5

# Augmentasi Data (INI BAGIAN YANG PENTING)
  augmentation:
    enabled: true
    factor: 5

# --- 4. Parameter Prediksi ---
prediction:
  probability_threshold: 0.3


loss_function: "hybrid"